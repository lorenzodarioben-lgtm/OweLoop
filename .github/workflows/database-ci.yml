name: Database CI

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/database-ci.yml'
  push:
    paths:
      - 'supabase/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/database-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  edge-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - name: Local Edge gateway and optional Storage stack
        shell: pwsh
        run: ./scripts/check-local.ps1 -SkipInstall -StorageAndFunctions
  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Start local Supabase stack
        run: node scripts/start-local-ci.mjs
      - name: Apply migrations
        run: npx supabase db reset
      - name: Run pgTAP tests
        run: npx supabase test db
      - name: Lint database schema
        run: npx supabase db lint --level warning --fail-on error
      - name: Test trusted account deletion handler
        run: node --test scripts/delete-account.test.mjs
      - name: Verify non-empty baseline upgrade
        run: node scripts/test-migration-upgrade.mjs
      - name: Verify non-empty Sprint II upgrade
        run: node scripts/test-migration-upgrade.mjs --sprint-ii
      - name: Configure disposable local integration environment
        run: |
          npx supabase status -o json | jq -r '"SUPABASE_URL=" + .API_URL, "SUPABASE_ANON_KEY=" + .ANON_KEY, "SUPABASE_SERVICE_ROLE_KEY=" + .SERVICE_ROLE_KEY' >> "$GITHUB_ENV"
      - name: Test real local multi-account journey and concurrency
        run: node scripts/test-local-integration.mjs
      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop
